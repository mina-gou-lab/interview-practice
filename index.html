    --bg-a: #F3F1EA;

    width:100%; min-height:90px; font-family:inherit; font-size:16px;
    border:1.5px solid var(--border); border-radius:14px; padding:12px 13px; resize:vertical;

  textarea:focus, .btn:focus-visible, input:focus-visible{ outline:2px solid var(--teal-100); outline-offset:1px; }
  .divider{ border:none; border-top:1px solid var(--border); margin:18px 0; }
  .record-section{ margin:14px 0; }
  .record-section audio{ width:100%; margin-top:8px; }

  }

  .history-date{ font-size:13px; font-weight:700; }

  .empty-state{ text-align:center; padding:24px 0; color:var(--text-muted); font-size:13px; }
  .stack{ display:flex; flex-direction:column; gap:10px; }

<body>
<div class="phone" id="app"></div>

<script>
/* =========================================================
   機能サポート判定(未対応ブラウザ・エラー対応のため)
========================================================= */
const SUPPORT = {
  mediaRecorder: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
  localStorage: (() => {
    try{
      const k = "__storage_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  })()
};

/* =========================================================
   質問データ
   ------------------------------------------------------
   話し方(面談)のポイントのみコード内に保持。
   質問・回答例はコード内に持たず、Google Apps Script経由で
   スプレッドシート「質問マスタ」から取得する(questionsは起動時に読み込む)。
========================================================= */
const DATA = {
  interviewTips: [
    { icon:"😊", text:"笑顔を意識しましょう" },
    { icon:"🗣", text:"いつもよりゆっくり話しましょう" },
    { icon:"💬", text:"結論から簡潔に伝えましょう" },
    { icon:"📝", text:"回答を整理してから、声に出して練習すると本番で話しやすくなります" }
  ],
  questions: [] // 起動時にloadQuestions()で読み込まれる
};

/* =========================================================
   設定
   ------------------------------------------------------
   cloudEnabled: 求職者向けの説明文を切り替えるスイッチ。
   GAS送信機能により実際に担当者が回答を確認できるようになったため true。
   gasWebAppUrl: Google Apps ScriptをWebアプリとして公開したときのURL。
   ここが空欄の間は「送信」機能は表示されない(ローカル保存のみで動作する)。
========================================================= */
const CONFIG = {
  cloudEnabled: true,
  gasWebAppUrl: "https://script.google.com/macros/s/AKfycbwbpsBvkCgjFdgeLQ7_LSv-z8Y1aAJMo7X8wacYhcUZX82ZGSiuUnfyzQ1sL3KhCZXj/exec"
};

function getPrivacyNoticeText(){
  return CONFIG.cloudEnabled
    ? "入力内容は、面談準備のサポートを目的として、担当者が確認する場合があります。"
    : "この練習内容は、この端末にのみ保存されます。他の人には共有されません。";
}

function getSavedConfirmationText(){
  return "この記録はブラウザに保存されました。トップ画面の「過去の練習を見る」からいつでも見返せます。";
}

/* =========================================================
   求職者(スタッフ)ごとの専用URL対応
   ------------------------------------------------------
   ?id=XXXX の形でアクセスされた場合、そのIDを使う。
   なければ、この端末用のIDを自動生成して使い続ける
   (この場合はスタッフIDが不明なため、GASへの送信ボタンは表示しない)。
========================================================= */
function getSessionId(){
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get("id");
  if(fromUrl){
    try{ localStorage.setItem("apparel_interview_last_id", fromUrl); }catch(e){}
    return { id: fromUrl, fromUrl: true };
  }
  try{
    const saved = localStorage.getItem("apparel_interview_last_id");
    if(saved) return { id: saved, fromUrl: false };
  }catch(e){}
  const generated = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "local_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  try{ localStorage.setItem("apparel_interview_last_id", generated); }catch(e){}
  return { id: generated, fromUrl: false };
}
const SESSION = getSessionId();
const SESSION_ID = SESSION.id;
const SESSION_ID_FROM_URL = SESSION.fromUrl;

/* URLの ?brand= を読み取る(例: ?id=LX001&brand=PRADA)。指定がなければ空文字。
   その場合、GAS側で「共通」ブランドの質問セットにフォールバックする。 */
const BRAND_ID = new URLSearchParams(window.location.search).get("brand") || "";

/* =========================================================
   質問データの読み込み(Google Apps Script経由でスプレッドシートから取得)
   ------------------------------------------------------
   ・1回の通信は10秒でタイムアウトさせる(AbortController)
   ・失敗したら1〜2回まで自動で再試行する(合計最大3回)
   ・すべて失敗したら、呼び出し元(boot)でエラー画面を表示する
========================================================= */
const LOAD_TIMEOUT_MS = 10000;
const LOAD_MAX_RETRIES = 2; // 初回 + 最大2回の再試行 = 最大3回試行

function fetchWithTimeout(url, timeoutMs, options){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  const fetchOptions = Object.assign({ method: "GET" }, options || {}, { signal: controller.signal });
  return fetch(url, fetchOptions).finally(() => clearTimeout(timer));
}

async function loadQuestionsOnce(attemptLabel){
  if(!CONFIG.gasWebAppUrl){
    throw new Error("gas-not-configured");
  }
  const url = CONFIG.gasWebAppUrl + "?brand=" + encodeURIComponent(BRAND_ID);
  const t0 = performance.now();
  let res;
  try{
    res = await fetchWithTimeout(url, LOAD_TIMEOUT_MS);
  }catch(err){
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    console.error(`[${attemptLabel}] fetch失敗 (${elapsed}秒経過): ${err.name} - ${err.message}`);
    if(err.name === "AbortError") throw new Error("timeout");
    throw new Error("network");
  }
  const fetchElapsed = ((performance.now() - t0) / 1000).toFixed(2);
  console.log(`[${attemptLabel}] fetch完了: ${fetchElapsed}秒 (HTTPステータス: ${res.status})`);

  if(!res.ok){
    console.error(`[${attemptLabel}] HTTPエラー: ステータス ${res.status} ${res.statusText}`);
    throw new Error("network");
  }

  const t1 = performance.now();
  let json;
  try{
    json = await res.json();
  }catch(err){
    const parseElapsed = ((performance.now() - t1) / 1000).toFixed(2);
    console.error(`[${attemptLabel}] レスポンスのJSON解析に失敗 (解析に${parseElapsed}秒): ${err.message}`);
    throw new Error("invalid-response");
  }

  // GAS側がサーバー処理時間(gasElapsedMs)を返すよう対応している場合、ここでログに出す
  // (対応していない場合はundefinedのまま表示されないだけで、動作に影響はない)
  if(json && typeof json.gasElapsedMs === "number"){
    console.log(`[${attemptLabel}] GAS側の処理時間: ${(json.gasElapsedMs / 1000).toFixed(2)}秒(サーバー内で計測)`);
  }

  if(!json || json.status !== "ok" || !Array.isArray(json.questions) || json.questions.length === 0){
    const msg = (json && json.message) || "no-questions";
    console.error(`[${attemptLabel}] GASからのエラー応答: ${msg}`, json);
    throw new Error(msg);
  }
  return json.questions.map(q => ({
    id: q.id,
    text: q.text,
    tip: q.tip || "",
    answerExample: q.answerExample || ""
  }));
}

/* 呼び出し元にリアルタイムで状況を伝えるため、進捗コールバックを受け取る */
async function loadQuestions(onAttempt){
  let lastErr;
  const overallStart = performance.now();
  for(let attempt = 1; attempt <= LOAD_MAX_RETRIES + 1; attempt++){
    if(onAttempt) onAttempt(attempt);
    const label = `質問読み込み 試行${attempt}/${LOAD_MAX_RETRIES + 1}`;
    try{
      const result = await loadQuestionsOnce(label);
      const totalElapsed = ((performance.now() - overallStart) / 1000).toFixed(2);
      console.log(`[${label}] 成功(合計経過時間: ${totalElapsed}秒)`);
      return result;
    }catch(err){
      lastErr = err;
      console.error(`[${label}] 失敗: ${err.message}`, err);
      if(attempt <= LOAD_MAX_RETRIES){
        const waitMs = 800 * attempt;
        console.log(`[${label}] ${waitMs}ms待ってから再試行します`);
        await new Promise(r => setTimeout(r, waitMs));
      }
    }
  }
  const totalElapsed = ((performance.now() - overallStart) / 1000).toFixed(2);
  console.error(`質問の読み込みが全て失敗しました(合計経過時間: ${totalElapsed}秒、最終エラー: ${lastErr && lastErr.message}`);
  throw lastErr;
}

/* =========================================================
   Storage抽象化レイヤー
   ------------------------------------------------------
   UI側は list / save / remove / saveDraft / loadDraft / clearDraft
   という関数だけを使います。将来クラウド保存(Supabaseなど)や
   管理者ログインを追加する際は、この中身をSESSION_IDをキーにした
   API呼び出しに差し替えるだけで済むように設計しています。
========================================================= */
const SESSIONS_KEY = `apparel_interview_sessions_v1__${SESSION_ID}`;
const DRAFT_KEY = `apparel_interview_draft_v1__${SESSION_ID}`;
const MAX_SESSIONS = 8;

const Storage = {
  async list(){
    if(!SUPPORT.localStorage) return [];
    try{
      const raw = localStorage.getItem(SESSIONS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ console.error("Storage.list failed", e); return []; }
  },
  async save(session){
    if(!SUPPORT.localStorage) return false;
    try{
      const sessions = await Storage.list();
      sessions.unshift(session);
      while(sessions.length > MAX_SESSIONS) sessions.pop();
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
      return true;
    }catch(e){
      console.error("Storage.save failed, retrying smaller", e);
      try{
        const sessions = await Storage.list();
        sessions.unshift(session);
        sessions.length = Math.max(1, sessions.length - 2);
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
        return true;
      }catch(e2){ console.error("Storage.save failed again", e2); return false; }
    }
  },
  async remove(sessionId){
    if(!SUPPORT.localStorage) return;
    const sessions = await Storage.list();
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions.filter(s => s.id !== sessionId)));
  },
  // 保存済みのセッションを、同じIDのまま中身だけ差し替える(AIフィードバックの再取得成功時などに使う)
  async updateSession(updatedSession){
    if(!SUPPORT.localStorage) return false;
    try{
      const sessions = await Storage.list();
      const idx = sessions.findIndex(s => s.id === updatedSession.id);
      if(idx === -1) return false;
      sessions[idx] = updatedSession;
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
      return true;
    }catch(e){ console.error("Storage.updateSession failed", e); return false; }
  },
  async saveDraft(draft){
    if(!SUPPORT.localStorage) return false;
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); return true; }
    catch(e){ console.error("saveDraft failed", e); return false; }
  },
  async loadDraft(){
    if(!SUPPORT.localStorage) return null;
    try{
      const raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async clearDraft(){
    if(!SUPPORT.localStorage) return;
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  }
};

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function debounce(fn, delay){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

/* =========================================================
   アプリの状態
========================================================= */
let state = {
  screen: "top",        // top | tips | practice | review | history | historyDetail | finishing
  qIndex: 0,
  showExample: false,
  answers: [],           // {text, audioDataUrl} ※どちらか一方でも両方でも可
  recording: false,
  hasHistory: false,
  hasDraft: false,
  lastSavedNotice: false,
  viewingSessionId: null,
  cloudStatus: "idle",   // idle | sending | success | error(回答送信+AIフィードバック取得をまとめた状態)
  reviewSession: null    // 振り返り画面に表示するセッション({answers, aiFeedback}) — 練習直後・過去の記録の閲覧どちらでも共通で使う
};

const app = document.getElementById("app");

function setState(patch){
  state = { ...state, ...patch };
  render();
}

async function refreshFlags(){
  const [sessions, draft] = await Promise.all([Storage.list(), Storage.loadDraft()]);
  state.hasHistory = sessions.length > 0;
  state.hasDraft = !!(draft && draft.answers && (
    draft.answers.some(a => a && ((a.text && a.text.trim()) || a.audioDataUrl)) || draft.qIndex > 0
  ));
}

function render(){
  if(state.screen === "top") return renderTop();
  if(state.screen === "tips") return renderTips();
  if(state.screen === "practice") return renderPractice();
  if(state.screen === "finishing") return renderFinishing();
  if(state.screen === "review") return renderReview();
  if(state.screen === "history") return renderHistory();
  if(state.screen === "historyDetail") return renderHistoryDetail();
}

/* ------------------------- トップ画面 ------------------------- */
function renderTop(){
  app.innerHTML = `
    <div class="accent-bar"></div>
    <div class="logo-mark">👗</div>
    <h1>アパレル面談練習</h1>
    <p class="muted center" style="margin-bottom:14px;">5〜10分で、一人で面談の練習ができます。</p>
    <div class="note-box">${getPrivacyNoticeText()}</div>
    ${!SUPPORT.localStorage ? `<div class="warn-box">この端末では自動保存が利用できない可能性があります(プライベートブラウズモードなど)。練習内容は、ページを閉じると失われる場合があります。</div>` : ""}
    <div class="stack">
      ${state.hasDraft ? `<button class="btn btn-primary" id="resume-btn">前回の続きから練習 ↗</button>` : ""}
      <button class="btn ${state.hasDraft ? "" : "btn-primary"}" id="start-btn">${state.hasDraft ? "新しく練習をはじめる" : "面談練習をはじめる ↗"}</button>
      ${state.hasHistory ? `<button class="btn" id="history-btn">過去の練習を見る</button>` : ""}
    </div>
  `;
  const resumeBtn = document.getElementById("resume-btn");
  if(resumeBtn){
    resumeBtn.onclick = async () => {
      const draft = await Storage.loadDraft();
      if(!draft){ setState({ screen:"tips" }); return; }
      setState({
        screen:"practice", qIndex: draft.qIndex || 0, answers: draft.answers || [],
        showExample:false
      });
    };
  }
  document.getElementById("start-btn").onclick = async () => {
    await Storage.clearDraft();
    setState({ screen:"tips", qIndex:0, answers:[], showExample:false });
  };
  const historyBtn = document.getElementById("history-btn");
  if(historyBtn) historyBtn.onclick = () => setState({ screen:"history" });
}

/* ------------------------- 面談のポイント ------------------------- */
function renderTips(){

/* ------------------------- 面談練習 ------------------------- */
function currentAnswer(){ return state.answers[state.qIndex] || { text:"", audioDataUrl:null }; }

function renderPractice(){
  const q = DATA.questions[state.qIndex];
  const total = DATA.questions.length;
  const ans = currentAnswer();
  const pct = Math.round(((state.qIndex + 1) / total) * 100);

  let recordSectionHtml;
  if(!SUPPORT.mediaRecorder){
    recordSectionHtml = `<p class="muted">このブラウザでは録音機能は利用できません。</p>`;
  } else if(state.recording){
    recordSectionHtml = `
      <button class="btn btn-recording" id="record-btn">⏹ 録音を停止する</button>
      <p class="muted" style="margin:8px 0 0;">録音中…</p>
    `;
  } else if(ans.audioDataUrl){
    recordSectionHtml = `
      <audio controls src="${ans.audioDataUrl}"></audio>
      <button class="btn" id="rerecord-btn" style="margin-top:8px; width:auto; padding:9px 16px;">🔄 録り直す</button>
    `;
  } else {
    recordSectionHtml = `<button class="btn" id="record-btn" style="width:auto; padding:9px 16px;">🎤 録音する</button>`;
  }

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label"><span>進捗</span><span>${state.qIndex+1} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>

    <p class="q-text">${q.text}</p>
    <p class="muted" style="margin-top:-8px; margin-bottom:14px;">ヒント: ${q.tip}</p>

    <textarea id="answer-text" placeholder="ここに回答を入力してください">${ans.text || ""}</textarea>

    <hr class="divider">

    <p class="muted" style="margin:0 0 8px;">声に出しての練習(任意)</p>
    <div class="record-section">${recordSectionHtml}</div>
    <div id="input-error" class="error-banner" style="display:none;"></div>

    <hr class="divider">

    <button class="btn btn-ghost" id="toggle-example">${state.showExample ? "▲ 回答例を隠す" : "▼ 回答例を見る"}</button>
    <div id="example-slot"></div>

    <div style="height:18px;"></div>
    <button class="btn btn-primary" id="next-btn">${state.qIndex === total-1 ? "終了して振り返りを見る" : "次の質問へ"}</button>
  `;

  const textarea = document.getElementById("answer-text");
  textarea.addEventListener("input", debounce(() => {
    const current = state.answers[state.qIndex] || { text:"", audioDataUrl:null };
    state.answers[state.qIndex] = { ...current, text: textarea.value };
    saveDraft();
  }, 500));

  if(SUPPORT.mediaRecorder){
    const recordBtn = document.getElementById("record-btn");
    if(recordBtn) recordBtn.onclick = toggleRecording;
    const rerecordBtn = document.getElementById("rerecord-btn");
    if(rerecordBtn) rerecordBtn.onclick = reRecord;
  }

  if(state.showExample){
    document.getElementById("example-slot").innerHTML = `
      <div class="example-box"><p>${q.answerExample}</p></div>
    `;
  }

  document.getElementById("toggle-example").onclick = () => setState({ showExample: !state.showExample });
  document.getElementById("next-btn").onclick = onNext;
}

/* ブラウザによって対応する録音フォーマットが異なるため、使えるものを順に試す */
function pickMimeType(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for(const c of candidates){
    if(MediaRecorder.isTypeSupported(c)) return c;
  }
  return "";
}

let activeRecorder = null;

function toggleRecording(){
  if(state.recording){
    if(activeRecorder){ try{ activeRecorder.stop(); }catch(e){} }
    return; // 後処理はonstopで行う
  }
  clearInputError();
  navigator.mediaDevices.getUserMedia({ audio:true }).then(stream => {
    let recorder;
    try{
      const mimeType = pickMimeType();
      recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    }catch(err){
      console.error(err);
      stream.getTracks().forEach(t => t.stop());
      showInputError(`このブラウザでは録音を開始できませんでした(${err.name || "エラー"})。`);
      return;
    }
    const chunks = [];
    recorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) chunks.push(e.data); };

    recorder.onerror = (e) => {
      console.error("MediaRecorder error", e.error);
      stream.getTracks().forEach(t => t.stop());
      activeRecorder = null;
      setState({ recording:false });
      showInputError(`録音中にエラーが発生しました(${e.error && e.error.name ? e.error.name : "不明なエラー"})。もう一度お試しください。`);
    };

    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      activeRecorder = null;
      try{
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        if(blob.size === 0) throw new Error("empty-recording");
        const audioDataUrl = await blobToDataURL(blob);
        const current = state.answers[state.qIndex] || { text:"", audioDataUrl:null };
        state.answers[state.qIndex] = { ...current, audioDataUrl };
        saveDraft();
        setState({ recording:false });
      }catch(e){
        console.error(e);
        setState({ recording:false });
        showInputError("録音の保存に失敗しました。もう一度お試しください。");
      }
    };

    recorder.start();
    activeRecorder = recorder;
    setState({ recording:true });
  }).catch(err => {
    console.error(err);
    showInputError(`マイクを使用できませんでした(${err.name || "エラー"})。ブラウザの設定でマイクの利用を許可してください。`);
  });
}

function reRecord(){
  const current = state.answers[state.qIndex] || { text:"", audioDataUrl:null };
  state.answers[state.qIndex] = { ...current, audioDataUrl: null };
  saveDraft();
  setState({});
}

function flushTextIfNeeded(){
  const ta = document.getElementById("answer-text");
  if(ta){
    const current = state.answers[state.qIndex] || { text:"", audioDataUrl:null };
    state.answers[state.qIndex] = { ...current, text: ta.value };
    saveDraft();
  }
}

function saveDraft(){
  Storage.saveDraft({ qIndex: state.qIndex, answers: state.answers, updatedAt: new Date().toISOString() });
}

function showInputError(msg){
  const el = document.getElementById("input-error");
  if(el){ el.textContent = msg; el.style.display = "block"; }
}
function clearInputError(){
  const el = document.getElementById("input-error");
  if(el){ el.style.display = "none"; el.textContent = ""; }
}

function onNext(){
  flushTextIfNeeded();
  const total = DATA.questions.length;
  if(state.qIndex === total - 1){
    finishAndSave();
  } else {
    setState({ qIndex: state.qIndex + 1, showExample:false });
    saveDraft();
  }
}

/* 練習終了時:完了済みセッションとして保存し、下書きは削除する */
async function finishAndSave(){
  const session = {
    id: "sess_" + Date.now(),
    createdAt: new Date().toISOString(),
    answers: DATA.questions.map((q, i) => {
      const a = state.answers[i] || {};
      return {
        questionId: q.id,
        questionText: q.text,
        text: a.text || null,
        audioDataUrl: a.audioDataUrl || null
      };
    }),
    aiFeedback: null // {perQuestion: {questionId: {goodPoints, improvementPoints, sampleAnswer}}}
  };

  const shouldSubmit = SESSION_ID_FROM_URL && !!CONFIG.gasWebAppUrl;

  if(shouldSubmit){
    // 送信中は専用の画面を挟む。ただし何が起きても(成功/失敗どちらでも)
    // 必ずこの後の保存・振り返り表示まで進む(止まったままにはしない)
    setState({ screen:"finishing" });
    const slowTimer = setTimeout(() => renderFinishing(true), 15000); // 15秒経ったら「時間がかかっています」を追加表示
    let cloudStatus = "error";
    try{
      const result = await submitSessionToCloud(session);
      session.aiFeedback = result.feedback || null;
      cloudStatus = "success";
    }catch(err){
      console.error("submitSessionToCloud failed", err);
      cloudStatus = "error";
    }
    clearTimeout(slowTimer);
    const saved = await Storage.save(session);
    await Storage.clearDraft();
    await refreshFlags();
    setState({ screen:"review", lastSavedNotice: saved, cloudStatus, reviewSession: session });
  } else {
    const saved = await Storage.save(session);
    await Storage.clearDraft();
    await refreshFlags();
    setState({ screen:"review", lastSavedNotice: saved, cloudStatus:"idle", reviewSession: session });
  }
}

function renderFinishing(showSlowNotice){
  app.innerHTML = `
    <div class="accent-bar"></div>
    <div class="logo-mark">👗</div>
    <h1>アパレル面談練習</h1>
    <p class="muted center">🤖 AIが回答を確認しています…</p>
    ${showSlowNotice ? `<p class="muted center" style="margin-top:8px;">録音の内容を確認しているため、少し時間がかかっています。そのままお待ちください。</p>` : ""}
  `;
}

/* ------------------------- 振り返り(直後・過去の記録どちらも共通で使う) ------------------------- */
function renderReview(){
  const session = state.reviewSession;
  const showCloudBanner = state.cloudStatus !== "idle";

  let cloudStatusHtml = "";
  if(state.cloudStatus === "success"){
    cloudStatusHtml = `<div class="note-box">✓ 担当者に送信しました。面談準備のサポートを目的として、担当者がこの内容を確認する場合があります。</div>`;
  } else if(state.cloudStatus === "error"){
    cloudStatusHtml = `<div class="warn-box">担当者への送信、またはAIフィードバックの取得に失敗しました。通信状況をご確認のうえ、<a href="#" id="retry-submit-link">もう一度試す</a>をお試しください。</div>`;
  }

  app.innerHTML = `
    <h2>今日の練習 🎉</h2>
    <p class="muted center" style="margin-top:-10px;">全 ${DATA.questions.length} 問・お疲れ様でした</p>
    ${state.lastSavedNotice
      ? `<div class="note-box">${getSavedConfirmationText()}</div>`
      : `<div class="warn-box">保存に失敗しました(このセッション内でのみ確認できます)。</div>`}
    ${showCloudBanner ? cloudStatusHtml : ""}
    ${session.answers.map((a,i) => renderAnswerCard(i+1, a, session.aiFeedback)).join("")}
    <div style="height:6px;"></div>
    <div class="stack">
      <button class="btn btn-primary" id="restart-btn">もう一度練習する</button>
      <button class="btn" id="top-btn">トップ画面に戻る</button>
    </div>
  `;
  const retryLink = document.getElementById("retry-submit-link");
  if(retryLink){
    retryLink.onclick = async (e) => {
      e.preventDefault();
      setState({ screen:"finishing" });
      let cloudStatus = "error";
      try{
        const result = await submitSessionToCloud(session);
        session.aiFeedback = result.feedback || null;
        cloudStatus = "success";
      }catch(err){
        console.error("submitSessionToCloud retry failed", err);
        cloudStatus = "error";
      }
      await Storage.updateSession(session); // 再試行で取得できたフィードバックを保存済みの記録にも反映
      setState({ screen:"review", cloudStatus, reviewSession: session });
    };
  }
  document.getElementById("restart-btn").onclick = () => setState({
    screen:"top", qIndex:0, answers:[], showExample:false, lastSavedNotice:false, cloudStatus:"idle", reviewSession:null
  });
  document.getElementById("top-btn").onclick = () => setState({ screen:"top", lastSavedNotice:false, cloudStatus:"idle", reviewSession:null });
}

/* 「①あなたの回答 ②AIからのフィードバック ③回答例」の3点を1つのカードにまとめて表示する。
   振り返り画面(直後)・過去の記録の詳細、両方から呼ばれる共通パーツ。 */
function renderAnswerCard(number, a, aiFeedback){
  let body = "";
  if(a.text && a.text.trim()) body += `<p class="answer-text">${a.text}</p>`;
  if(a.audioDataUrl) body += `<audio controls src="${a.audioDataUrl}" style="margin-top:${a.text ? '8px' : '0'};"></audio>`;
  if(!body) body = `<p class="answer-text muted">(未回答)</p>`;

  const byId = aiFeedback && aiFeedback.perQuestion ? aiFeedback.perQuestion[a.questionId] : null;
  const byPosition = aiFeedback && aiFeedback.perQuestionArray ? aiFeedback.perQuestionArray[number - 1] : null;
  const fb = byId || byPosition || null;
  let fbHtml = "";
  if(fb){
    const good = (fb.goodPoints || []).map(p => `<li>${p}</li>`).join("");
    const improve = (fb.improvementPoints || []).map(p => `<li>${p}</li>`).join("");
    const etiquette = (fb.etiquetteNotes || []).map(p => `<li>${p}</li>`).join("");
    const missing = (fb.missingElements || []).map(p => `<li>${p}</li>`).join("");
    fbHtml = `
      <div class="ai-feedback-box">
        <p class="ai-feedback-title">🤖 AIからのフィードバック</p>
        ${good ? `<p class="ai-feedback-label">良かった点</p><ul class="ai-feedback-list">${good}</ul>` : ""}
        ${improve ? `<p class="ai-feedback-label">改善点</p><ul class="ai-feedback-list">${improve}</ul>` : ""}
        ${etiquette ? `<p class="ai-feedback-label">面接マナー・言葉遣い</p><ul class="ai-feedback-list">${etiquette}</ul>` : ""}
        ${fb.sampleAnswer ? `<p class="ai-feedback-label">回答例</p><p class="ai-feedback-sample">${fb.sampleAnswer}</p>` : ""}
        ${missing ? `<p class="ai-feedback-label">さらに良くするために追加すると良い内容</p><ul class="ai-feedback-list">${missing}</ul>` : ""}
      </div>
    `;
  }

  return `<div class="q-card"><p class="q-label">${number}. ${a.questionText}</p>${body}${fbHtml}</div>`;
}

/* ------------------------- 回答送信+AIフィードバック取得(Google Apps Script経由、1回の通信でまとめて行う) ------------------------- */
const SUBMIT_TIMEOUT_MS = 60000; // Gemini API呼び出し(複数の音声回答を含む場合は特に時間がかかる)を考慮して長めに設定

async function submitSessionToCloud(session){
  const payload = {
    id: SESSION_ID,
    brand: BRAND_ID,
    submittedAt: session.createdAt,
    answers: session.answers.map(a => ({
      questionId: a.questionId,
      questionText: a.questionText,
      text: a.text || "",
      audioDataUrl: a.audioDataUrl || null
    }))
  };
  let res;
  try{
    // GASのWebアプリはContent-Type: application/jsonだとCORSで弾かれることがあるため、
    // text/plainで送り、GAS側でJSON.parseする方式にしている(GAS連携の定番の回避策)
    res = await fetchWithTimeout(CONFIG.gasWebAppUrl, SUBMIT_TIMEOUT_MS, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  }catch(err){
    if(err.name === "AbortError") throw new Error("timeout");
    throw err;
  }
  const json = await res.json();
  if(!json || json.status !== "ok"){
    throw new Error((json && json.message) || "unknown error");
  }
  return { feedback: normalizeFeedback(json.feedback) };
}

/* GASからは perQuestion が配列([{questionId, goodPoints, improvementPoints, sampleAnswer}, ...])で
   返ってくる。画面表示側は質問IDで直接引ける形の方が扱いやすいので、辞書形式に変換しておく。
   あわせて、元の並び順の配列も保持しておく。
   (音声のみの回答は、Geminiがquestion Idを正確に復唱できず、表記が微妙にズレて
    返ってくることがまれにあるため、その場合は「送った順番」で対応づける保険にする) */
function normalizeFeedback(feedback){
  if(!feedback || !Array.isArray(feedback.perQuestion)) return null;
  const perQuestion = {};
  feedback.perQuestion.forEach(f => { perQuestion[f.questionId] = f; });
  return { perQuestion, perQuestionArray: feedback.perQuestion };
}

/* ------------------------- 過去の練習一覧 ------------------------- */
async function renderHistory(){
  const sessions = await Storage.list();
  app.innerHTML = `
    <h2>過去の練習</h2>
    ${sessions.length === 0 ? `<p class="empty-state">まだ記録がありません</p>` : sessions.map(s => `
      <div class="history-row">
        <div>
          <p class="history-date">${formatDate(s.createdAt)}</p>
          <p class="history-meta">${countAnswered(s)} / ${DATA.questions.length} 問 回答</p>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <button class="btn" data-id="${s.id}" style="width:auto; padding:7px 15px; min-height:auto;">見る</button>
          <button class="btn-danger" data-del="${s.id}">削除</button>
        </div>
      </div>
    `).join("")}
    <div style="height:16px;"></div>
    <button class="btn" id="back-btn">トップ画面に戻る</button>
  `;
  app.querySelectorAll("[data-id]").forEach(btn => {
    btn.onclick = () => setState({ screen:"historyDetail", viewingSessionId: btn.dataset.id });
  });
  app.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      if(confirm("この記録を削除しますか?")){
        await Storage.remove(btn.dataset.del);
        await refreshFlags();
        render();
      }
    };
  });
  document.getElementById("back-btn").onclick = () => setState({ screen:"top" });
}

function formatDate(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function countAnswered(session){
  return session.answers.filter(a => (a.text && a.text.trim()) || a.audioDataUrl).length;
}

/* ------------------------- 過去の練習の詳細 ------------------------- */
async function renderHistoryDetail(){
  const sessions = await Storage.list();
  const session = sessions.find(s => s.id === state.viewingSessionId);
  if(!session){
    app.innerHTML = `<p class="empty-state">記録が見つかりませんでした</p><button class="btn" id="back-btn">一覧に戻る</button>`;
    document.getElementById("back-btn").onclick = () => setState({ screen:"history" });
    return;
  }
  app.innerHTML = `
    <h2>練習の記録</h2>
    <p class="muted center" style="margin-top:-10px; margin-bottom:16px;">${formatDate(session.createdAt)}</p>
    ${session.answers.map((a,i) => renderAnswerCard(i+1, a, session.aiFeedback)).join("")}
    <div style="height:6px;"></div>
    <button class="btn" id="back-btn">一覧に戻る</button>
  `;
  document.getElementById("back-btn").onclick = () => setState({ screen:"history" });
}

/* =========================================================
   起動
========================================================= */
function renderLoading(showRetryButton){
  app.innerHTML = `
    <div class="accent-bar"></div>
    <div class="logo-mark">👗</div>
    <h1>アパレル面談練習</h1>
    <p class="muted center">質問を読み込んでいます…</p>
    ${showRetryButton ? `
      <p class="muted center" style="margin-top:8px;">通信に時間がかかっています</p>
      <button class="btn btn-primary" id="retry-load-btn">再読み込み</button>
    ` : ""}
  `;
  const btn = document.getElementById("retry-load-btn");
  if(btn) btn.onclick = () => boot();
}

function renderLoadError(reason){
  const messages = {
    "gas-not-configured": "質問データの取得先が設定されていません。管理者にご確認ください。",
    "no-questions": "この専用URLに対応する質問が見つかりませんでした。URLが正しいか、管理者にご確認ください。",
    "timeout": "通信エラーが発生しました。もう一度お試しください。",
    "network": "通信エラーが発生しました。もう一度お試しください。",
    "invalid-response": "通信エラーが発生しました。もう一度お試しください。"
  };
  app.innerHTML = `
    <div class="accent-bar"></div>
    <div class="logo-mark">👗</div>
    <h1>アパレル面談練習</h1>
    <div class="warn-box">${messages[reason] || "通信エラーが発生しました。もう一度お試しください。"}</div>
    <button class="btn btn-primary" id="retry-load-btn">もう一度読み込む</button>
  `;
  document.getElementById("retry-load-btn").onclick = () => boot();
}

async function boot(){
  renderLoading(false);
  await refreshFlags();

  // 10秒経っても結果が出ていなければ、「読み込み中」画面に再読み込みボタンを足す
  // (loadQuestions自体は1回10秒でタイムアウト・自動再試行するため、
  //  この表示はユーザーへの安心材料であり、処理自体は裏で継続している)
  let settled = false;
  const slowTimer = setTimeout(() => {
    if(!settled) renderLoading(true);
  }, 10000);

  try{
    DATA.questions = await loadQuestions();
    settled = true;
    clearTimeout(slowTimer);
    render();
  }catch(err){
    settled = true;
    clearTimeout(slowTimer);
    console.error("質問の読み込みが最終的に失敗しました", err);
    renderLoadError(err && err.message);
  }
}

boot();
